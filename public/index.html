<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AXD Lab</title>
<style>
:root { --navy: #0B304C; --blue: #007EB4; --slate: #364248; --bg: #F6FAFC; --line: rgba(11,48,76,.14); color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--slate); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: 0 12px 32px -12px rgba(11,48,76,.25); }
.head { background: var(--navy); color: #fff; padding: 28px; }
.head small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #7CCBEA; margin-bottom: 8px; }
.head h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
form { padding: 24px 28px 28px; display: grid; gap: 14px; }
p { margin: 0; font-size: .95rem; line-height: 1.5; }
label.f { font-weight: 600; font-size: .9rem; color: var(--navy); }
input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
input[type=password]:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.rem { display: flex; gap: 8px; align-items: center; font-size: .88rem; }
.rem input { accent-color: var(--blue); width: 16px; height: 16px; }
button { font: inherit; font-weight: 700; padding: 12px 18px; border-radius: 14px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
button[disabled] { opacity: .6; cursor: progress; }
.err { color: #B42318; font-size: .88rem; min-height: 1.2em; }
</style>
</head>
<body>
<main class="card">
  <div class="head"><small>Team learning guide</small><h1>AXD Lab</h1></div>
  <form id="gate">
    <p>This guide is for our design team. Enter the team password to continue.</p>
    <label class="f" for="pw">Team password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="rem"><input id="rem" type="checkbox"> Remember me on this device for 30 days</label>
    <button id="go" type="submit">Open the guide</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

  var K = "dfa-gate-key", DAYS = 30;
  function u8(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }
